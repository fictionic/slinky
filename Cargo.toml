[package]
name = "slinky"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A utility for wrangling symbolic links on Unix systems"
repository = "https://github.com/fictionic/slinky"
homepage = "https://github.com/fictionic/slinky"
license = "MIT"
readme = "README.md"
publish = false

# Not published to crates.io (the name is taken), but dist still ships the binaries
[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4.0", features = ["derive", "wrap_help"] }
strum = { version = "0.26", features = ["derive"] }
regex = "1.10"
walkdir = "2.4"
colored = "2.1"
anyhow = "1.0"
pathdiff = "0.2"

[build-dependencies]
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.5.65"
clap_mangen = "0.2.31"
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
tempfile = "3.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
